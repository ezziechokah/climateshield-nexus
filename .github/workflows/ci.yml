name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply PostgreSQL migration
        run: pnpm --filter @climateshield/api migrate
        env:
          DATABASE_MODE: postgres
          DATABASE_URL: postgresql://nexus:nexus_test@localhost:5432/nexus_test
      - name: Run PostgreSQL integration tests
        run: pnpm --filter @climateshield/api test
        env:
          TEST_DATABASE_URL: postgresql://nexus:nexus_test@localhost:5432/nexus_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - run: pnpm audit --prod