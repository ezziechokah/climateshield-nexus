services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - nexus-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: climateshield_nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d climateshield_nexus"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  nexus-postgres:
  nexus-redis: